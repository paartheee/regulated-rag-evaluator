<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Regulated RAG Evaluator architecture</title><desc id="desc">A LangGraph workflow retrieves policy chunks, drafts a cited response, evaluates it, then approves or sends it to human review.</desc>
  <rect width="1200" height="440" fill="#f4f1e8"/>
  <style>.h{font:700 34px Arial,sans-serif;fill:#121312}.s{font:500 16px Arial,sans-serif;fill:#55544e}.n{font:700 19px Arial,sans-serif;fill:#121312}.b{fill:#f4f1e8;stroke:#121312;stroke-width:3}.a{fill:#d8ff35;stroke:#121312;stroke-width:3}.line{stroke:#121312;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#121312"/></marker></defs>
  <text x="55" y="66" class="h">REGULATED RAG EVALUATOR</text><text x="55" y="98" class="s">An eval-gated LangGraph workflow for policy-grounded answers.</text>
  <rect x="55" y="168" width="190" height="105" rx="8" class="b"/><text x="78" y="212" class="n">1. Retrieve</text><text x="78" y="242" class="s">rank policy chunks</text>
  <line x1="245" y1="220" x2="330" y2="220" class="line"/>
  <rect x="335" y="168" width="205" height="105" rx="8" class="b"/><text x="358" y="212" class="n">2. Draft</text><text x="358" y="242" class="s">answer with citations</text>
  <line x1="540" y1="220" x2="625" y2="220" class="line"/>
  <rect x="630" y="168" width="220" height="105" rx="8" class="a"/><text x="653" y="212" class="n">3. Evaluate</text><text x="653" y="242" class="s">groundedness + safety</text>
  <line x1="850" y1="220" x2="935" y2="220" class="line"/>
  <rect x="940" y="120" width="190" height="105" rx="8" class="b"/><text x="963" y="164" class="n">Approved</text><text x="963" y="194" class="s">answer delivered</text>
  <rect x="940" y="280" width="190" height="105" rx="8" class="b"/><text x="963" y="324" class="n">Human review</text><text x="963" y="354" class="s">weak or risky answer</text>
  <path d="M850 220 L895 220 L895 172 L935 172" fill="none" class="line"/><path d="M850 220 L895 220 L895 332 L935 332" fill="none" class="line"/>
</svg>
